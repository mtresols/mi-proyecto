<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1305.3780000000002 193.8" width="1305.3780000000002" height="193.8" style="--bg:#FFFFFF;--fg:#3B3B3B;--line:#3B3B3B;--accent:#005FB8;--muted:#3B3B3BCC;--surface:#F8F8F8;--border:#3B3B3B;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="A" data-label="1. El Generador">
  <rect x="40" y="40" width="222.891" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="40" width="222.891" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">1. El Generador</text>
</g>
<g class="subgraph" data-id="B" data-label="2. La Memoria">
  <rect x="534.981" y="40" width="245.12099999999998" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="534.981" y="40" width="245.12099999999998" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="546.981" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">2. La Memoria</text>
</g>
<g class="subgraph" data-id="C" data-label="3. La Pantalla">
  <rect x="1016.552" y="40" width="248.826" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="1016.552" y="40" width="248.826" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="1028.5520000000001" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">3. La Pantalla</text>
</g>
<polyline class="edge" data-from="Laravel" data-to="Prometheus" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Expone números en /prometheus" points="246.891,110.9 550.981,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="Prometheus" data-to="Grafana" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Consulta datos históricos" points="764.102,110.9 1032.5520000000001,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Laravel" data-to="Prometheus" data-label="Expone números en /prometheus">
  <rect x="312.89099999999996" y="94.9" width="172.09" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="398.936" y="110.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Expone números en /prometheus</text>
</g>
<g class="edge-label" data-from="Prometheus" data-to="Grafana" data-label="Consulta datos históricos">
  <rect x="830.102" y="94.9" width="136.45000000000002" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="898.327" y="110.05000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Consulta datos históricos</text>
</g>
<g class="node" data-id="Laravel" data-label="Tu Proyecto Laravel
(Calcula tiempos y visitas)" data-shape="rectangle">
  <rect x="56" y="84" width="190.891" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="151.44549999999998" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="151.44549999999998" dy="-3.9000000000000012">Tu Proyecto Laravel</tspan><tspan x="151.44549999999998" dy="16.900000000000002">(Calcula tiempos y visitas)</tspan></text>
</g>
<g class="node" data-id="Prometheus" data-label="Prometheus
(Guarda el historial numérico)" data-shape="rectangle">
  <rect x="550.981" y="84" width="213.12099999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="657.5415" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="657.5415" dy="-3.9000000000000012">Prometheus</tspan><tspan x="657.5415" dy="16.900000000000002">(Guarda el historial numérico)</tspan></text>
</g>
<g class="node" data-id="Grafana" data-label="Grafana
(Dibuja los paneles y gráficos)" data-shape="rectangle">
  <rect x="1032.5520000000001" y="84" width="216.826" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1140.9650000000001" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1140.9650000000001" dy="-3.9000000000000012">Grafana</tspan><tspan x="1140.9650000000001" dy="16.900000000000002">(Dibuja los paneles y gráficos)</tspan></text>
</g>
</svg>